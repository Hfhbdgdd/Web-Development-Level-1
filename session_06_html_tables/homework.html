<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>

    <style>
    table,        
        th,
        td{
            border: 1px solid #000;
        }


    </style>


</head>

<body>
    <p><h1>My Monthly Budget</h1></p>

    <table>
        <tr>
            <th>Item</th>
            <th>Amount</th>
        </tr>

        <tr>
            <td>Food</td>
            <td>£20</td>
        </tr>

        <tr>
            <td>Travel</td>
            <td>£10</td>
        </tr>
    </table>












</body>

</html>
