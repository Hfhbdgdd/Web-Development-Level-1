<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>session_13_more_html_forms</title>
</head>

<body>
    <!-- main container -->
    <div class="container">
        <div class="header">
            <ul>
                <li>Round Trip</li>
                <li>One Way</li>
                <li>Multi City</li>
            </ul>
        </div>
        <form action="#" method="post">
            <div class="form-group">
                <label for="departure">From:</label>
                <input type="text" id="departure" name="departure" placeholder="Type Your Departure City">
            </div>   
            <div class="form-group">
                <label for="destination">To:</label>
                <input type="text" id="destination" name="destination" placeholder="Type Your Destionation">
            </div>     

            <!-- search button -->
            <button type="submit" class="search-button">🔍 Search Flights</button>
            
        </form>
    </div>
    

</body>

</html>
