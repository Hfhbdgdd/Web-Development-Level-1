<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw</title>

    <style>
        button {
            cursor: pointer;
            padding: 16px;
            background-color: yellow;
            transition: transform 0.1 ease, background-color 0.1 ease;
        }

        button:active {
            transform: scale(0.95);
            background-color: green;
        }
    </style>
</head>

<body>
    <button>Click me!</button>
</body>

</html>
