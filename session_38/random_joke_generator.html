<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style2.css">
    <title>Random Joke Generator</title>
</head>

<body>
    <div class="container">
        <h1>Random Joke Generator</h1>

    <h2 id="jokeGenerator">CLICK THE BUTTON!</h2>

    <button onclick="generateJoke()">Generate joke</button>

    </div>
    
    <script>
        function generateJoke() {
            let jokeArray = [
                "What does my morning alarm do for a living?  It hosts a podcast where every episode is just it talking while I try to get five more minutes of sleep." , 
                "What happened when I tried to teach my backpack organization?  It ended up with a folder full of complaints." , 
                "Why does my sandwich have such a big personality?  It always manages to bring something to the table." 
            ] ;

            let randomNumber = Math.floor(Math.random()* jokeArray.length);
            document.getElementById("jokeGenerator").innerHTML = jokeArray[randomNumber] ;
        }
    </script>
</body>

</html>
